<body>
    <div id="wrapper">

        <header class="content">
            <h1><a href="index.html">Path of Light Yoga Studio</a></h1>

        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>

                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>

        <main>
            <h2>Contact Path of Light Yoga Studio</h2>

            <p>Fill out the form below to contact Path of Light Yoga Studio. All information is required.</p>

            <form method="post" action="https://webdevbasics.net/scripts/yoga.php">

                 <label for="myName">Name:</label>
                <input type="text" id="myName" name="myName" required>

                <label for="myEmail">E-mail:</label>
                <input type="email" id="myEmail" name="myEmail" required>

                <label for="myRefer">How did you hear about us?</label>
                <input list="referral" id="myRefer" name="myRefer" required>
                <datalist id="referral">
                    <option value="Google">
                    <option value="Bing">
                    <option value="Facebook">
                    <option value="Friend">
                    <option value="Radio Ad">
                </datalist>

                <input type="submit" id="mySubmit" value="Send Now">

                <label for="myComments">Comments:</label>
                <textarea id="myComments" name="myComments" rows="2" cols="20" required></textarea>

            </form>



        </main>

        <footer>
            <small><i>Copyright 2020 Path of Light Yoga Studio</i></small><br>
            <a href="mailto:SomeEmail@example.com">jacob@nealy.com</a>
        </footer>

    </div>
